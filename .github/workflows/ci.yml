name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Awizzy.slnx

      - name: Build (warnings as errors)
        run: dotnet build Awizzy.slnx -c Release --no-restore

      - name: Test
        run: dotnet run --project tests/Awizzy.Core.Tests -c Release --no-build

  # Catches Native AOT regressions (trim warnings, unsupported reflection) before a
  # release tag hits them. Skipped on PRs to keep feedback fast.
  publish-smoke:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish (Native AOT)
        run: dotnet publish src/Awizzy.App -c Release -r ${{ matrix.rid }} -o publish

      # Best-effort runtime check: macOS runners have a real UI session, so this is the
      # closest thing to hands-on macOS verification available without a Mac.
      - name: GUI smoke (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          ./publish/Awizzy.App --demo &
          APP_PID=$!
          sleep 12
          screencapture -x smoke.png
          kill $APP_PID || true
          mkdir -p smoke-logs
          cp -r "$TMPDIR/AwizzyDemo/logs/." smoke-logs/ 2>/dev/null || true
          cp "$HOME/Library/Application Support/Awizzy/logs/crash.log" smoke-logs/ 2>/dev/null || true

      - name: Upload smoke artifacts (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: macos-smoke
          path: |
            smoke.png
            smoke-logs/
          if-no-files-found: ignore
